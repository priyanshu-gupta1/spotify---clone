<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Spotify - Web Player: Music for everyone
    </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <script src="script.js"></script>
</head>

<body>
    <div class="container flex bg-black">
        <div class="left bg-black">
            <div class="close">
                <img class="invert" src="cross.svg" alt="">
            </div>
            <div class="home p-1 m-1 bg-gray rounded">
                <div class="logo"><img class="invert" src="logo.svg" alt=""></div>
                <ul>
                    <li><img class="invert" src="home.svg" alt="home">Home</li>
                    <li><img class="invert" src="serch.svg" alt="serch">Serch</li>
                </ul>

            </div>
            <div class="library bg-gray rounded p-1">
                <div class="heading">
                    <img class="invert" src="library.svg" alt="">
                    <h2>Your library</h2>
                </div>
                <div class="songList">
                    <ul>

                    </ul>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/in-en/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/in-en/safetyandprivacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3"><span>About Ads</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>
        </div>
        <div class="right ">
            <div class="header">
                <div class="nav  m-1 p-1 ">
                    <div class="slider">
                        <div class="hamburgar">
                            <img class="invert " src="hamburgar.svg" alt="">
                        </div>
                        <div>

                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                                color="#ffffff" fill="none">
                                <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"
                                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                                color="ffffff" fill="none">
                                <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"
                                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </div>
                    </div>
                    <div class="button">
                        <button class="btn-1">Sign up</button>
                        <button class="btn-2">Log in</button>
                    </div>
                </div>
                <div class="spotifyPlaylist">
                    <h1>Spotify Playlist</h1>
                    <div class="cardContainer">
                       
                    </div>
                    <div class="playbar">
                        <div class="seekbar">
                            <div class="circle">

                            </div>
                        </div>
                        <div class="songinfo">

                        </div>
                        <div class="songbtn">
                            <img id="previous" class="invert" src="prevbtn.svg" alt="">
                            <img id="play" class="invert" src="play.svg" alt="">
                            <img id="next" class="invert" src="nextbtn.svg" alt="">
                        </div>
                        <div class="soundbox">
                            <div class="songtime">

                            </div>
                            <div class="volumebtn">
                        
                                    <img id="sound" class="invert s-btn" src="sound.svg" alt="">
                                
                                <div class="range">
                                    <input type="range" name="volumebtn">
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    </div>
  
</body>

</html>
